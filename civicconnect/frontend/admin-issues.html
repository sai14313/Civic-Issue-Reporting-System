<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Issue Management - CivicConnect</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <i class="fas fa-city"></i> CivicConnect
            </div>
            <div class="nav-links">
                <a href="admin.html" class="nav-link">Dashboard</a>
                <a href="analytics.html" class="nav-link">Analytics</a>
                <a href="#" id="adminIssuesLogout" class="nav-link btn-primary" style="background: var(--danger);">Logout</a>
            </div>
        </div>
    </nav>

    <div class="dashboard-container">
        <div class="welcome-bar">
            <h1><i class="fas fa-tasks"></i> Issue Management</h1>
            <a href="admin.html" class="btn btn-outline">Back to Dashboard</a>
        </div>

        <div class="admin-table">
            <table>
                <thead>
                    <tr>
                        <th>Complaint ID</th>
                        <th>Title</th>
                        <th>Category</th>
                        <th>Status</th>
                        <th>Priority</th>
                        <th>Reported By</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="adminIssuesTable">
                    <!-- Issues will be loaded here -->
                </tbody>
            </table>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/admin-issues.js"></script>
</body>
</html>
