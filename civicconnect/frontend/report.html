<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Issue - CivicConnect</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <i class="fas fa-city"></i> CivicConnect
            </div>
            <div class="nav-links">
                <a href="dashboard.html" class="nav-link">Dashboard</a>
                <a href="login.html" class="nav-link btn-primary">Login</a>
            </div>
        </div>
    </nav>

    <div class="form-container">
        <div class="form-card">
            <h2><i class="fas fa-exclamation-triangle"></i> Report a Civic Issue</h2>
            <form id="reportForm">
                <div class="form-group">
                    <label for="title">Issue Title</label>
                    <input type="text" id="title" placeholder="e.g., Pothole on Main Street" required>
                </div>
                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" required>
                        <option value="">Select a category</option>
                        <option value="Road & Pothole">Road & Pothole</option>
                        <option value="Streetlight">Streetlight</option>
                        <option value="Garbage & Sanitation">Garbage & Sanitation</option>
                        <option value="Water Supply">Water Supply</option>
                        <option value="Drainage">Drainage</option>
                        <option value="Public Safety">Public Safety</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea id="description" rows="4" placeholder="Describe the issue in detail" required></textarea>
                </div>
                <div class="form-group">
                    <label for="severity">Severity</label>
                    <select id="severity">
                        <option value="Low">Low</option>
                        <option value="Medium" selected>Medium</option>
                        <option value="High">High</option>
                        <option value="Critical">Critical</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="location_name">Location Name</label>
                    <input type="text" id="location_name" placeholder="e.g., Main Street near Traffic Signal" required>
                </div>
                <div class="form-group">
                    <label>Location on Map</label>
                    <div id="report-map" style="height: 300px; border-radius: 8px; margin-bottom: 15px;"></div>
                    <input type="hidden" id="latitude" value="40.7128">
                    <input type="hidden" id="longitude" value="-74.0060">
                </div>
                <div class="form-group">
                    <label>Upload Photo (optional)</label>
                    <div class="file-upload" onclick="document.getElementById('photo').click()">
                        <i class="fas fa-cloud-upload-alt"></i>
                        <p>Click to upload photo of the issue</p>
                    </div>
                    <input type="file" id="photo" accept="image/*" style="display: none;">
                </div>
                <button type="submit" class="btn btn-primary btn-block">Submit Report</button>
            </form>
            <div style="margin-top: 20px; text-align: center;">
                <a href="dashboard.html" class="btn btn-outline">Back to Dashboard</a>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js/report.js"></script>
</body>
</html>
